<div style="text-align:center">
  <h1>Summary</h1>
</div>

<nav>
  <a routerLink="/dashboard/accounts" routerLinkActive="active" ariaCurrentWhenActive="page">List of Accounts</a> 
</nav>


<div>Choose a developer</div>
<select [(ngModel)]="dataSource.filter">
  <ng-container *ngFor="let developer of developerOptions">
    <option [ngValue]="developer">{{developer}}</option>
  </ng-container>
</select>

<h2>Developer groups of {{dataSource.filter}}</h2>
<table mat-table [dataSource]="devGroups(nonRepeated('DBMDG_GROUP_NAME'))" class="mat-elevation-z8">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
    <th mat-header-cell *matHeaderCellDef>
      {{column.header}}
    </th>
    <td mat-cell *matCellDef="let row">
      {{column.cell(row)}}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="reducedDisplayedColumns2"></tr>
  <tr mat-row
    (click)="goToDevGroup(row.DBMDG_GROUP_NAME)"
    *matRowDef="let row; columns: reducedDisplayedColumns2;"></tr>
</table>

<h2>Accounts of {{dataSource.filter}}</h2>
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by {{column.header}}">
      {{column.header}}
    </th>
    <td mat-cell *matCellDef="let row">
      {{column.cell(row)}}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="reducedDisplayedColumns1"></tr>
  <tr mat-row 
    (click)="goToAccount(row.USERNAME)"
    *matRowDef="let row; columns: reducedDisplayedColumns1;"></tr>
</table>
