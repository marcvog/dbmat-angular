<div style="text-align:center">
  <h1>Developers</h1>
</div>
<h2>Here are the developers: </h2>

<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. atlas" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)" class="table-container mat-elevation-z8">
  <ng-container matColumnDef="DBMDEV_ID">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by DBMDEV_ID"> DBMDEV_ID </th>
    <td mat-cell *matCellDef="let developer"> {{developer.DBMDEV_ID}} </td>
  </ng-container>

  <ng-container matColumnDef="CONTACT">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by CONTACT"> CONTACT </th>
    <td mat-cell *matCellDef="let developer"> {{developer.CONTACT}} </td>
  </ng-container>

  <ng-container matColumnDef="DBMDEV_INS_DATE">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by DBMDEV_INS_DATE"> DBMDEV_INS_DATE </th>
    <td mat-cell *matCellDef="let developer"> {{developer.DBMDEV_INS_DATE}} </td>
  </ng-container>

  <ng-container matColumnDef="DBMDEV_UPD_DATE">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by DBMDEV_UPD_DATE"> DBMDEV_UPD_DATE </th>
    <td mat-cell *matCellDef="let developer"> {{developer.DBMDEV_UPD_DATE}} </td>
  </ng-container>

  <ng-container matColumnDef="CONTACT_NAME">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by CONTACT_NAME"> CONTACT_NAME </th>
    <td mat-cell *matCellDef="let developer"> {{developer.CONTACT_NAME}} </td>
  </ng-container>

  <ng-container matColumnDef="CONTACT_EMAIL">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by CONTACT_EMAIL"> CONTACT_EMAIL </th>
    <td mat-cell *matCellDef="let developer"> {{developer.CONTACT_EMAIL}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
